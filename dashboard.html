<!DOCTYPE html>
<html lang="es" class="notranslate" translate="no">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASDAQ 100</title>
    <meta name="description"
      content="Panel de cotizaciones en tiempo real de las principales acciones del NASDAQ: precios, variación diaria y evolución histórica.">
    <meta name="theme-color" content="#f6f8fa">
    <link rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230969da'/%3E%3Cpath d='M18 46V18h6l16 20V18h6v28h-6L24 26v20z' fill='%23fff'/%3E%3C/svg%3E">
    <!-- GOOGLE FONTS -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
    <!-- StyleSheet -->
    <link rel="stylesheet" href="https://speaks-code.github.io/dashboard/css/css_dashborad.css">
    <!-- Evita parpadeo de tema: aplica el tema guardado antes de pintar -->
    <script>
      (function () {
        var t = null;
        try {t = localStorage.getItem("nasdaq-theme");} catch (e) { }
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <!-- Funciones JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>

  <body>
    <div class="container">
      <header class="page-header">
        <div class="header-left">
          <h1 class="page-title">NASDAQ 100 Dashboard</h1>
          <p class="page-subtitle" id="pageDate">Datos al --</p>
        </div>
        <div class="header-right">
          <button class="theme-toggle" id="themeToggle" role="switch" aria-checked="false"
            aria-label="Cambiar entre tema claro y oscuro" title="Tema claro / oscuro">
            <span class="tt-thumb">
              <svg class="tt-icon tt-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <path
                  d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.3 11.3 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.3-11.3 1.4-1.4">
                </path>
              </svg>
              <svg class="tt-icon tt-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
              </svg>
            </span>
          </button>
          <button class="btn-refresh" id="refreshBtn">
            <span id="btnSpin" class="spin" style="display:none;"></span>
            <span class="btnText" id="btnText">Actualizar</span>
          </button>
        </div>
      </header>

      <div class="alert" id="alertBox" role="alert"></div>

      <!-- Grilla de acciones -->
      <div class="stock-grid" id="stockGrid" aria-label="Cotizaciones"></div>

      <!-- Fila de gráfico dinámico -->
      <div class="chart-row" id="chartRow">
        <div class="chart-header">
          <div class="chart-title-group">
            <span class="chart-symbol" id="chartSymbol">--</span>
            <span class="chart-name" id="chartName">--</span>
            <span class="chart-price" id="chartPrice">--</span>
            <span class="chart-change" id="chartChange">--</span>
          </div>
          <div class="timeframes" id="timeframes" role="group" aria-label="Período del gráfico">
            <button class="tf-btn" data-tf="1D">1D</button>
            <button class="tf-btn" data-tf="1W">1W</button>
            <button class="tf-btn active" data-tf="1M">1M</button>
            <button class="tf-btn" data-tf="3M">3M</button>
            <button class="tf-btn" data-tf="6M">6M</button>
            <button class="tf-btn" data-tf="1Y">1Y</button>
            <button class="tf-btn" data-tf="MAX">MAX</button>
          </div>
        </div>
        <div class="chart-container">
          <canvas id="mainChart"></canvas>
        </div>
      </div>

      <!-- "% de Rendimiento" -->
      <div class="rendimiento" id="rendimiento">
        <!-- El JavaScript inyectará el contenido aquí automáticamente -->
      </div>

      <!-- Stats bar -->
      <div class="stats-row" id="indexBar">
        <div class="stat-card">
          <div class="stat-label">Estado</div>
          <div class="stat-value" id="statStatus">Esperando</div>
          <div class="stat-sub" id="statStatusSub">Presiona Actualizar</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Acciones</div>
          <div class="stat-value" id="statCount">--</div>
          <div class="stat-sub">Cargadas</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Alzas / Bajas</div>
          <div class="stat-value" id="statGainers">-- / --</div>
          <div class="stat-sub" id="statTrend">--</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Actualizado</div>
          <div class="stat-value" id="statDate">--</div>
          <div class="stat-sub" id="statTime">--</div>
        </div>
      </div>

      <footer class="page-footer">
        <span class="footer-text">
          Datos históricos via Cloudflare
          <a href="https://www.cloudflare.com/" target="_blank" rel="noopener" aria-label="Cloudflare">
            <img src="https://speaks-code.github.io/dashboard/img/cloudflare-svgrepo-com.svg" alt="Cloudflare">
          </a>
          D1 + Finnhub
          <a href="https://finnhub.io/" target="_blank" rel="noopener" aria-label="Finnhub">
            <img src="https://speaks-code.github.io/dashboard/img/finnhub.png" alt="Finnhub">
          </a>
          API
        </span>
      </footer>
    </div>

    <script src="https://speaks-code.github.io/dashboard/js/js_dashboard.js"></script>
  </body>
<!-- Pagina bajo licencia hjn -->
</html>
